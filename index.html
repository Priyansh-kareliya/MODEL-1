<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Complete Registration Form</title>

  <style>
    body{
      font-family: Arial, sans-serif;
      background:#f4f4f4;
      padding:20px;
    }

    form{
      background:white;
      max-width:900px;
      margin:auto;
      padding:25px;
      border-radius:10px;
      box-shadow:0 0 10px rgba(0,0,0,0.1);
    }

    h1{
      text-align:center;
      color:#333;
    }

    fieldset{
      margin-bottom:20px;
      border:2px solid #ddd;
      padding:20px;
      border-radius:8px;
    }

    legend{
      font-weight:bold;
      color:#444;
    }

    label{
      display:block;
      margin-top:12px;
      font-weight:bold;
    }

    input, select, textarea, button{
      width:100%;
      padding:10px;
      margin-top:5px;
      border:1px solid #ccc;
      border-radius:5px;
    }

    input[type="radio"],
    input[type="checkbox"]{
      width:auto;
      margin-right:8px;
    }

    .inline{
      display:flex;
      gap:20px;
      margin-top:10px;
    }

    .inline label{
      font-weight:normal;
    }

    button{
      background:#007bff;
      color:white;
      font-size:16px;
      cursor:pointer;
      border:none;
    }

    button:hover{
      background:#0056b3;
    }
  </style>
</head>

<body>

<form action="#" method="post" enctype="multipart/form-data" autocomplete="on">

  <h1>Registration Form</h1>

  <!-- Personal Information -->
  <fieldset>
    <legend>Personal Information</legend>

    <label for="fname">First Name</label>
    <input type="text" id="fname" name="fname" placeholder="Enter first name" required>

    <label for="lname">Last Name</label>
    <input type="text" id="lname" name="lname" placeholder="Enter last name">

    <label for="email">Email</label>
    <input type="email" id="email" name="email">

    <label for="password">Password</label>
    <input type="password" id="password" name="password">

    <label for="phone">Phone Number</label>
    <input type="tel" id="phone" name="phone">

    <label for="age">Age</label>
    <input type="number" id="age" name="age" min="1" max="100">

    <label for="birthdate">Birth Date</label>
    <input type="date" id="birthdate" name="birthdate">

    <label for="birthtime">Birth Time</label>
    <input type="time" id="birthtime" name="birthtime">

    <label for="week">Select Week</label>
    <input type="week" id="week" name="week">

    <label for="month">Select Month</label>
    <input type="month" id="month" name="month">

    <label for="datetime">Date & Time</label>
    <input type="datetime-local" id="datetime" name="datetime">

  </fieldset>

  <!-- Gender -->
  <fieldset>
    <legend>Gender</legend>

    <div class="inline">
      <label>
        <input type="radio" name="gender" value="male"> Male
      </label>

      <label>
        <input type="radio" name="gender" value="female"> Female
      </label>

      <label>
        <input type="radio" name="gender" value="other"> Other
      </label>
    </div>
  </fieldset>

  <!-- Skills -->
  <fieldset>
    <legend>Skills</legend>

    <div class="inline">
      <label><input type="checkbox" name="skills" value="html"> HTML</label>
      <label><input type="checkbox" name="skills" value="css"> CSS</label>
      <label><input type="checkbox" name="skills" value="js"> JavaScript</label>
    </div>
  </fieldset>

  <!-- Dropdown -->
  <fieldset>
    <legend>Education</legend>

    <label for="course">Select Course</label>
    <select id="course" name="course">
      <option value="">--Choose Course--</option>
      <option>BCA</option>
      <option>MCA</option>
      <option>B.Tech</option>
      <option>MBA</option>
    </select>

    <label for="city">Choose City</label>
    <input list="cities" id="city" name="city">

    <datalist id="cities">
      <option value="Ahmedabad">
      <option value="Surat">
      <option value="Vadodara">
      <option value="Rajkot">
    </datalist>

  </fieldset>

  <!-- Address -->
  <fieldset>
    <legend>Address</legend>

    <label for="address">Full Address</label>
    <textarea id="address" name="address" rows="4"></textarea>
  </fieldset>

  <!-- File Upload -->
  <fieldset>
    <legend>Upload Documents</legend>

    <label for="photo">Upload Photo</label>
    <input type="file" id="photo" name="photo">

    <label for="resume">Upload Resume</label>
    <input type="file" id="resume" name="resume">
  </fieldset>

  <!-- Extra Inputs -->
  <fieldset>
    <legend>Other Inputs</legend>

    <label for="website">Website URL</label>
    <input type="url" id="website" name="website">

    <label for="search">Search</label>
    <input type="search" id="search" name="search">

    <label for="color">Favorite Color</label>
    <input type="color" id="color" name="color">

    <label for="range">Experience Level</label>
    <input type="range" id="range" name="range" min="0" max="10">

    <label for="hiddenField">Hidden Field</label>
    <input type="hidden" id="hiddenField" value="hiddenData">

    <label for="readonly">Readonly Field</label>
    <input type="text" id="readonly" value="Readonly Text" readonly>

    <label for="disabled">Disabled Field</label>
    <input type="text" id="disabled" value="Disabled Text" disabled>

  </fieldset>

  <!-- Progress and Meter -->
  <fieldset>
    <legend>Progress</legend>

    <label>Profile Completion</label>
    <progress value="70" max="100"></progress>

    <label>Skill Meter</label>
    <meter value="0.8">80%</meter>
  </fieldset>

  <!-- Terms -->
  <fieldset>
    <legend>Terms & Conditions</legend>

    <label>
      <input type="checkbox" required>
      I agree to the terms and conditions
    </label>
  </fieldset>

  <!-- Buttons -->
  <fieldset>
    <legend>Actions</legend>

    <button type="submit">Register</button>
    <button type="reset">Reset</button>
    <button type="button" onclick="alert('Custom Button Clicked')">
      Click Me
    </button>
  </fieldset>

</form>

</body>
</html>
